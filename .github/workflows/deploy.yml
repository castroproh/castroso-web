name: Build and deploy CASTROSO.JPG

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      confirm_production_deploy:
        description: "Confirmar explícitamente el despliegue público (requiere además RELEASE_APPROVED=true en Variables)."
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # CUSTOM_DOMAIN is an Actions repository variable (not a secret).
      # Leave it empty to keep the current project URL; set it to castroso.jpg
      # only after the domain is configured in GitHub Pages and its DNS is ready.
      - name: Configure build target
        shell: bash
        env:
          CUSTOM_DOMAIN: ${{ vars.CUSTOM_DOMAIN }}
        run: |
          if [[ -n "${CUSTOM_DOMAIN:-}" ]]; then
            echo "BASE_PATH=" >> "$GITHUB_ENV"
            echo "SITE_URL=https://${CUSTOM_DOMAIN}" >> "$GITHUB_ENV"
            echo "CUSTOM_DOMAIN=${CUSTOM_DOMAIN}" >> "$GITHUB_ENV"
            echo "Using custom domain: ${CUSTOM_DOMAIN}"
          else
            echo "BASE_PATH=/${GITHUB_REPOSITORY#*/}/" >> "$GITHUB_ENV"
            echo "SITE_URL=https://${GITHUB_REPOSITORY_OWNER}.github.io" >> "$GITHUB_ENV"
            echo "CUSTOM_DOMAIN=" >> "$GITHUB_ENV"
            echo "Using default GitHub Pages project URL"
          fi

      - name: Build site
        run: npm run build
        env:
          NODE_ENV: production
          CUSTOM_DOMAIN: ${{ vars.CUSTOM_DOMAIN }}
          BASE_PATH: ${{ vars.CUSTOM_DOMAIN != '' && '/' || format('/{0}/', github.event.repository.name) }}
          SITE_URL: ${{ vars.CUSTOM_DOMAIN != '' && format('https://{0}', vars.CUSTOM_DOMAIN) || format('https://{0}.github.io', github.repository_owner) }}
          CONTACT_ENDPOINTS_ENABLED: ${{ vars.CONTACT_ENDPOINTS_ENABLED }}
          PUBLIC_LEADS_PRIVACY_APPROVED: ${{ vars.PUBLIC_LEADS_PRIVACY_APPROVED }}
          FORMSPREE_ENDPOINT: ${{ secrets.FORMSPREE_ENDPOINT }}
          MAIN_LEADS_ENDPOINT: ${{ vars.MAIN_LEADS_ENDPOINT }}
          # Newsletter remains disabled until there is independent consent in the UI.

      - name: Check site
        run: npm run check
        env:
          CUSTOM_DOMAIN: ${{ vars.CUSTOM_DOMAIN }}
          BASE_PATH: ${{ vars.CUSTOM_DOMAIN != '' && '/' || format('/{0}/', github.event.repository.name) }}
          SITE_URL: ${{ vars.CUSTOM_DOMAIN != '' && format('https://{0}', vars.CUSTOM_DOMAIN) || format('https://{0}.github.io', github.repository_owner) }}
          CONTACT_ENDPOINTS_ENABLED: ${{ vars.CONTACT_ENDPOINTS_ENABLED }}
          PUBLIC_LEADS_PRIVACY_APPROVED: ${{ vars.PUBLIC_LEADS_PRIVACY_APPROVED }}

      - name: Check web-to-Laravel contract
        run: npm run check:integration

      - name: Check static Pages export safety
        run: npm run check:pages
        env:
          CUSTOM_DOMAIN: ${{ vars.CUSTOM_DOMAIN }}
          BASE_PATH: ${{ vars.CUSTOM_DOMAIN != '' && '/' || format('/{0}/', github.event.repository.name) }}
          SITE_URL: ${{ vars.CUSTOM_DOMAIN != '' && format('https://{0}', vars.CUSTOM_DOMAIN) || format('https://{0}.github.io', github.repository_owner) }}

      - name: Block deploy while the privacy notice is a draft
        run: |
          if grep -q '\[PENDIENTE' dist/privacidad/index.html; then
            echo "::error::El aviso de privacidad conserva marcadores [PENDIENTE]. No se despliega hasta la revisión legal."
            exit 1
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.confirm_production_deploy == true && vars.RELEASE_APPROVED == 'true' }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4