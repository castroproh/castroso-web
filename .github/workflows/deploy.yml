name: Deploy CASTROSO.JPG to GitHub Pages

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # CUSTOM_DOMAIN is an Actions repository variable (not a secret).
      # Leave it empty to keep the current project URL; set it to castroso.jpg
      # only after the domain is configured in GitHub Pages and its DNS is ready.
      - name: Configure build target
        shell: bash
        env:
          CUSTOM_DOMAIN: ${{ vars.CUSTOM_DOMAIN }}
        run: |
          if [[ -n "${CUSTOM_DOMAIN:-}" ]]; then
            echo "BASE_PATH=" >> "$GITHUB_ENV"
            echo "SITE_URL=https://${CUSTOM_DOMAIN}" >> "$GITHUB_ENV"
            echo "CUSTOM_DOMAIN=${CUSTOM_DOMAIN}" >> "$GITHUB_ENV"
            echo "Using custom domain: ${CUSTOM_DOMAIN}"
          else
            echo "BASE_PATH=/${GITHUB_REPOSITORY#*/}/" >> "$GITHUB_ENV"
            echo "SITE_URL=https://${GITHUB_REPOSITORY_OWNER}.github.io" >> "$GITHUB_ENV"
            echo "CUSTOM_DOMAIN=" >> "$GITHUB_ENV"
            echo "Using default GitHub Pages project URL"
          fi

      - name: Build site
        run: npm run build
        env:
          FORMSPREE_ENDPOINT: ${{ secrets.FORMSPREE_ENDPOINT }}
          NEWSLETTER_ENDPOINT: ${{ secrets.NEWSLETTER_ENDPOINT }}

      - name: Verify generated site
        run: npm run check

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
